services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-staff_platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-staff_platform_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-staff_platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-staff_platform_db}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staff_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-staff_platform_db}
    ports:
      - "5432:5432"
    volumes:
      - staff_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staff_platform} -d ${POSTGRES_DB:-staff_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - staff_platform_redis:/data

volumes:
  staff_platform_pgdata:
  staff_platform_redis:
